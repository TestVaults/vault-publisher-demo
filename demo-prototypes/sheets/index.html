<!doctype html><html><head><meta charset="utf-8"><title>Sheets and popovers</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fafafa}
main{max-width:720px;margin:40px auto;padding:0 20px}
button{padding:10px 16px;border-radius:10px;border:1px solid #ccc;background:#fff;font-size:15px;margin-right:8px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:320px;background:#fff;box-shadow:-10px 0 30px #0002;padding:24px;transform:translateX(105%);transition:transform .3s}
.drawer.open{transform:none}
.popover{position:absolute;margin-top:8px;background:#222;color:#fff;border-radius:10px;padding:12px 16px;width:220px}
</style></head><body><main>
<h1>Account settings</h1>
<p>Plain page, no frame. A drawer slides in from the right; a popover appears under a button.</p>
<p><button id="open">Open notifications drawer</button><button id="tip">What is this?</button></p>
<div id="tip-holder"></div>
<p>Changes are saved automatically.</p>
</main>
<aside class="drawer"><h2>Notifications</h2><p>Email me about orders</p><p>Weekly digest</p><button id="close">Done</button></aside>
<script>
var d=document.querySelector(".drawer");
document.getElementById("open").onclick=function(){d.classList.add("open")};
document.getElementById("close").onclick=function(){d.classList.remove("open")};
document.getElementById("tip").onclick=function(){var h=document.getElementById("tip-holder");if(h.firstChild){h.innerHTML="";return;}h.innerHTML='<div class="popover">Settings apply to every device you sign in on.</div>';};
</script></body></html>
