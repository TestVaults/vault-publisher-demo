<!doctype html><html><head><meta charset="utf-8"><title>Shop app on a phone</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#dfe3ea;font-family:system-ui,sans-serif}
.wrap{display:flex;gap:40px;align-items:center}
.notes{max-width:260px;color:#333}
.notes h1{font-size:22px}
.device{width:390px;height:844px;padding:14px;border-radius:56px;background:#111;box-shadow:0 30px 60px #0004;transform:scale(.8);transform-origin:center}
.device iframe{width:390px;height:844px;border:0;border-radius:44px;background:#fff;display:block}
</style></head><body>
<div class="wrap">
  <div class="notes"><h1>Shop app</h1><p>The phone frame is this page. The screen inside it is a separate page in an iframe.</p></div>
  <div class="device"><iframe id="screen" title="Phone screen" src="screens/home.html"></iframe></div>
</div>
</body></html>
