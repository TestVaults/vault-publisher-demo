<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f6f6f8;overflow:hidden}
header{position:sticky;top:0;background:#3a5bd9;color:#fff;padding:54px 20px 16px;font-size:22px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;font-size:15px}
main{height:calc(100vh - 92px);overflow-y:auto;padding:12px 16px 120px}
.item{background:#fff;border-radius:14px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px #0001}
.item button{border:0;background:none;color:#c33;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:16px 16px 34px;background:#fff;border-top:1px solid #eee}
.bar button{width:100%;padding:14px;border:0;border-radius:12px;background:#3a5bd9;color:#fff;font-size:16px;font-weight:600}
.scrim{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.is-open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 40px;transform:translateY(110%);transition:transform .35s ease}
.sheet.is-open{transform:none}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet label{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.sheet .apply{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px}
.popup{position:fixed;inset:0;display:grid;place-items:center;background:#0005}
.popup .card{background:#fff;border-radius:16px;padding:22px;width:80%;text-align:center}
.popup .card button{margin:14px 6px 0;padding:10px 18px;border-radius:10px;border:1px solid #ccc;background:#fff;font-size:15px}
.popup .card .danger{background:#c33;color:#fff;border-color:#c33}
</style></head><body>
<header><span>Shop</span><a href="cart.html">Cart (2)</a></header>
<main id="list"></main>
<div class="bar"><button id="filters">Filter and sort</button></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet-el"><h2>Filter and sort</h2>
<label>Price: low to high <input type="radio" name="s" checked></label>
<label>Newest first <input type="radio" name="s"></label>
<label>Only in stock <input type="checkbox"></label>
<button class="apply" id="apply">Show 24 results</button></section>
<script>
var names=["Trail shoes","Running socks","Rain jacket","Water bottle","Head torch","Trekking poles","Base layer","Sun hat","Gaiters","Day pack","Map case","First aid kit"];
var list=document.getElementById("list");
names.forEach(function(n,i){var d=document.createElement("div");d.className="item";d.innerHTML="<span>"+n+" <small>$"+(12+i*7)+"</small></span><button data-del>Remove</button>";list.appendChild(d);});
var sheet=document.querySelector(".sheet"),scrim=document.getElementById("scrim");
sheet.removeAttribute("id");
function setSheet(o){sheet.classList.toggle("is-open",o);scrim.classList.toggle("is-open",o);}
document.getElementById("filters").onclick=function(){setSheet(true)};
scrim.onclick=function(){setSheet(false)};
document.getElementById("apply").onclick=function(){setSheet(false)};
list.addEventListener("click",function(e){
  if(!e.target.matches("[data-del]"))return;
  var p=document.createElement("div");p.className="popup";
  p.innerHTML='<div class="card"><strong>Remove this item?</strong><p>You can add it back later.</p><button class="keep">Keep</button><button class="danger">Remove</button></div>';
  p.addEventListener("click",function(ev){if(ev.target.tagName==="BUTTON")p.remove();});
  document.body.appendChild(p);
});
</script></body></html>
