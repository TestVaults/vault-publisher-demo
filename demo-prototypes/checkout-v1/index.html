<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout v1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f6;color:#1d1d1f}
header{padding:18px 24px;background:#3a5bd9;color:#fff;font-weight:700;font-size:20px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:24px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px #0001}
h2{margin:0 0 12px;font-size:17px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#3a5bd9;color:#fff;font-size:16px;font-weight:600;margin-top:16px}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0}
</style></head><body><header>Checkout (v1)</header><main>
<section class="card"><h2>Your order</h2><div class="row"><span>Trail shoes</span><b>$120</b></div><div class="row"><span>Socks ×2</span><b>$18</b></div><div class="row"><span>Shipping</span><b>$9</b></div><div class="row"><span>Total</span><b>$147</b></div></section>
<section class="card"><h2>Payment</h2><input placeholder="Card number"><input placeholder="MM / YY"><input placeholder="Name on card"><button>Pay now</button></section>
</main></body></html>
