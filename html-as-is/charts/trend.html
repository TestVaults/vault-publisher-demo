<title>A second page, one folder down</title>

<!-- And a stylesheet of its own, beside it. Two pages can share one
     stylesheet and still have their own. -->

<main>

<h1>A second page, one folder down</h1>

<p class="lede">
  This file lives in a subfolder and reaches back out of it with

  <code>..</code> survived the move into the site.
</p>

<figure class="chart">
  <svg viewBox="0 0 320 140" width="320" height="140" role="img"
       aria-label="A placeholder line, rising then falling">

              fill="none" stroke="#7a5c2e" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>

  </svg>
  <figcaption>
    Inline SVG, which is part of the document rather than a file: nothing to

  </figcaption>
